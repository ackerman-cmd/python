[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "school-lab"
version = "0.1.0"
description = "ЛР 1: приём работ и расширяемые анализаторы, Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "build>=1,<2", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
school-lab = "school_lab.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
school_lab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = "artifacts/cache/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["artifacts", ".venv-*", "*.ipynb"]
cache-dir = "artifacts/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
cache_dir = "artifacts/cache/mypy"

[tool.coverage.run]
branch = true
source = ["school_lab"]
relative_files = true
data_file = "artifacts/coverage/.coverage"

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 90
